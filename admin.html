<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090d">
  <title>VECXUS Admin — Panel de revisión</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="flex min-h-dvh flex-col bg-[#07090d] lg:h-dvh lg:overflow-hidden">
    <!-- Header -->
    <header class="flex items-center gap-3 border-b border-white/8 bg-[#0b0e14]/90 px-4 py-3 backdrop-blur-xl">
      <a href="index.html" aria-label="Volver al mapa" class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-300 transition hover:bg-white/10">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div class="flex-1">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          <h1 class="text-[17px] font-black tracking-[0.14em] text-white">VECXUS <span class="text-red-400">ADMIN</span></h1>
        </div>
        <p class="text-[9.5px] font-bold tracking-[0.28em] text-slate-500">PANEL DE REVISIÓN DE INCIDENTES</p>
      </div>
      <div id="escalados-badge" class="hidden items-center gap-1.5 rounded-xl border border-amber-400/30 bg-amber-400/10 px-3 py-2 text-[12px] font-extrabold text-amber-300"></div>
    </header>

    <main class="flex flex-1 flex-col lg:min-h-0 lg:flex-row">
      <!-- Map -->
      <section class="relative h-[38dvh] shrink-0 lg:h-auto lg:flex-1">
        <div id="admin-map" class="vx-dark-tiles h-full w-full" style="background:#0a0d12"></div>
      </section>

      <!-- Sidebar -->
      <aside class="flex min-h-0 flex-col border-t border-white/8 lg:w-[440px] lg:border-l lg:border-t-0">
        <!-- Stats -->
        <div id="admin-stats" class="grid grid-cols-4 gap-2 px-4 pt-4"></div>

        <!-- Filters -->
        <div id="admin-filters" class="flex items-center gap-2 overflow-x-auto px-4 pb-1 pt-3"></div>

        <!-- Cards -->
        <div id="admin-cards" class="flex-1 space-y-2.5 overflow-y-auto px-4 py-3 lg:min-h-0">
          <div class="flex items-center justify-center gap-2 py-16 text-slate-500">
            <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            <span class="text-[13px] font-semibold">Cargando reportes…</span>
          </div>
        </div>
      </aside>
    </main>

    <!-- Toast -->
    <div class="pointer-events-none fixed inset-x-0 bottom-6 z-[2000] flex justify-center px-6">
      <div id="admin-toast" class="vx-toast max-w-sm rounded-2xl border px-4 py-3 text-center text-[13px] font-bold shadow-2xl backdrop-blur-xl" style="display:none"></div>
    </div>

    <!-- OSM watermark -->
    <div class="pointer-events-none fixed right-3 top-3 z-[2000] hidden items-center gap-1 rounded-full bg-black/40 px-2.5 py-1 text-[9px] font-extrabold tracking-widest text-slate-500 lg:flex">
      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
      OpenStreetMap
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
